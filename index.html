<style>
html,body{height:100%;margin:0;background:#101318}
body.spin{background:#f3f5f8} body.spin.dark{background:#0e131a}
.sp{position:relative;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif;color:#e7ebf1}
.lg{width:min(56vw,260px);height:auto}
/* 로고 획이 쓰는 순서대로 하나씩 켜짐 */
.lg .on{opacity:.13;animation:seg .1s ease-out forwards}
@keyframes seg{to{opacity:1}}
@media (prefers-reduced-motion:reduce){.lg .on{animation:none;opacity:1}}
body.spin .lg .on{animation:none;opacity:1}
.bt{font-size:clamp(18px,5.2vw,24px);font-weight:700;letter-spacing:-.01em;line-height:1;transform:skewX(-7deg);transform-origin:left bottom}
.disc{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 28px);margin:0 auto;max-width:400px;padding:0 20px;font-size:12.5px;line-height:1.65;color:#8b95a5;text-align:center;word-break:keep-all}
.msg{position:absolute;left:0;right:0;top:calc(50% + 80px);font-size:13px;color:#8b95a5;text-align:center;padding:0 24px}
body.spin .sp{display:none}
</style>
<script>if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(function(){});</script>
</head>
<body>
<script>
/* 처음 열 때는 로고, 새로고침(화면을 아래로 당김)일 때는 로고 없이 바로 첫 화면 */
var OSH_MODE = (function(){ var r = false; try{ var n = performance.getEntriesByType("navigation")[0]; r = !!(n && n.type === "reload") || sessionStorage.getItem("osh-started") === "1"; sessionStorage.setItem("osh-started", "1"); }catch(e){} return r ? "spin" : "logo"; })();
if(OSH_MODE === "spin"){ document.body.className = "spin"; try{ if(localStorage.getItem("osh-mode") === "dark") document.body.className += " dark"; }catch(e){} }
</script>
<div class="sp" role="status" aria-label="법령 통합 조회를 여는 중">

<div class="bt">법령 통합 조회</div>
<div class="msg" id="msg"></div>
<p class="disc">법령을 빠르게 찾아보기 위한 참고용입니다.<br>중요한 판단은 국가법령정보센터 원문으로 한 번 더 확인하세요.</p>
</div>
<script>try{if(localStorage.getItem("osh-lang")==="en"){document.querySelector(".bt").textContent="Integrated Law Search";document.querySelector(".disc").innerHTML="For quick reference only.<br>For important decisions, always check the original text at law.go.kr.";}}catch(e){}</script>
<script>
/* 시작 화면을 보여 주는 동안 앱 본체(app.js)를 미리 받아 두고, 열리면 이어지는 전환을 합니다 */
(function(){
  var MIN = OSH_MODE === "spin" ? 0 : 1550, msg = document.getElementById("msg");
  var slow = setTimeout(function(){ msg.textContent = "여는 데 시간이 걸리고 있습니다. 인터넷 연결을 확인해 주세요."; }, 15000);
  Promise.all([
    fetch("app.js").then(function(r){ if(!r.ok) throw new Error("app.js를 찾지 못했습니다 (" + r.status + ")"); return r.text(); }),
    new Promise(function(ok){ setTimeout(ok, MIN); })
  ]).then(function(v){ clearTimeout(slow); try{ sessionStorage.setItem("osh-intro", OSH_MODE); }catch(e){} (0, eval)(v[0]); })
    .catch(function(e){ clearTimeout(slow); msg.textContent = "앱을 열지 못했습니다. " + (e && e.message || "") + " 인터넷 연결을 확인한 뒤 다시 열어 주세요."; });
})();
</script>

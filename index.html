<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>법령 통합 조회</title>
<meta name="theme-color" content="#101318">
<meta name="apple-mobile-web-app-capable" content="yes">

<style>
html,body{height:100%;margin:0;background:#101318}
body.spin{background:#f3f5f8} body.spin.dark{background:#0e131a}
.sp{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif;color:#e7ebf1}
.lg{width:min(56vw,260px);height:auto}
.bt{font-size:clamp(18px,5.2vw,24px);font-weight:700;letter-spacing:-.01em;line-height:1;transform:skewX(-7deg);transform-origin:left bottom}
.msg{font-size:13px;color:#8b95a5;min-height:1.5em;text-align:center;padding:0 24px}
/* 새로고침용: 점 4개가 도는 모양 (하나는 빨강) */
.dots{display:none;position:relative;width:44px;height:44px;animation:spin 1s linear infinite;will-change:transform}
.dots i{position:absolute;width:10px;height:10px;border-radius:50%;background:#9aa4b4}
.dots i:nth-child(1){left:17px;top:0;background:#d7191f} .dots i:nth-child(2){right:0;top:17px} .dots i:nth-child(3){left:17px;bottom:0} .dots i:nth-child(4){left:0;top:17px}
body.spin .lg,body.spin .bt{display:none} body.spin .dots{display:block}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
<script>if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(function(){});</script>
</head>
<body>
<script>
/* 처음 열 때는 로고, 새로고침(화면을 아래로 당김)일 때는 도는 점 */
var OSH_MODE = (function(){ var r = false; try{ var n = performance.getEntriesByType("navigation")[0]; r = !!(n && n.type === "reload") || sessionStorage.getItem("osh-started") === "1"; sessionStorage.setItem("osh-started", "1"); }catch(e){} return r ? "spin" : "logo"; })();
if(OSH_MODE === "spin"){ document.body.className = "spin"; try{ if(localStorage.getItem("osh-mode") === "dark") document.body.className += " dark"; }catch(e){} }
</script>

<div class="bt">법령 통합 조회</div>
<div class="dots" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
<div class="msg" id="msg"></div>
</div>
<script>
/* 시작 화면을 보여 주는 동안 앱 본체(app.js)를 미리 받아 두고, 열리면 이어지는 전환을 합니다 */
(function(){
  var MIN = OSH_MODE === "spin" ? 300 : 900, msg = document.getElementById("msg");
  var slow = setTimeout(function(){ msg.textContent = "여는 데 시간이 걸리고 있습니다. 인터넷 연결을 확인해 주세요."; }, 15000);
  Promise.all([
    fetch("app.js").then(function(r){ if(!r.ok) throw new Error("app.js를 찾지 못했습니다 (" + r.status + ")"); return r.text(); }),
    new Promise(function(ok){ setTimeout(ok, MIN); })
  ]).then(function(v){ clearTimeout(slow); try{ sessionStorage.setItem("osh-intro", OSH_MODE); }catch(e){} (0, eval)(v[0]); })
    .catch(function(e){ clearTimeout(slow); msg.textContent = "앱을 열지 못했습니다. " + (e && e.message || "") + " 인터넷 연결을 확인한 뒤 다시 열어 주세요."; });
})();
</script>
